<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}TAM Dashboard{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='dashboard.css') }}">
</head>
<body>
  <header class="topbar">
    <a href="{{ url_for('index') }}">TAM Dashboard</a>
    <nav>
      <a href="{{ url_for('prompt_guide') }}">Prompt guide</a>
      <a href="{{ url_for('metrics_guide') }}">Metric guide</a>
      <a href="{{ url_for('metrics_rankings') }}">Metrics</a>
      <a href="{{ url_for('analysis_hub') }}">Analysis</a>
      <a href="{{ url_for('saved_queries_view') }}">Queries</a>
      <a href="{{ url_for('compare_view') }}">Compare</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <div id="image-modal" class="modal" aria-hidden="true">
    <button id="modal-close" class="modal-close" type="button">Close</button>
    <div class="modal-body">
      <img id="modal-image" alt="">
      <div id="modal-caption" class="modal-caption"></div>
    </div>
  </div>
  <script src="{{ url_for('static', filename='dashboard.js') }}"></script>
</body>
</html>
